                // 요청하신 전체 확률(3성 2.9%, 2성 12.8%) 중 2성 대 3성의 상대 비율(약 12.8 : 2.9) 적용
                if (rand < 18.47) { 
                    selectedItem = identities_3star[Math.floor(Math.random() * identities_3star.length)];
                    return { type: "identity", tier: "000", sinner: selectedItem.sinner, name: selectedItem.name };
                } else {
                    selectedItem = identities_2star[Math.floor(Math.random() * identities_2star.length)];
                    return { type: "identity", tier: "00", sinner: selectedItem.sinner, name: selectedItem.name };
                }
            }

            // 일반 뽑기 확률: E.G.O 1.3%, 3성 2.9%, 2성 12.8%, 1성 83%
            let rand = Math.random() * 100;

            if (rand < 1.3) {
                // E.G.O (1.3%) -> ZAYIN, TETH, HE, WAW 중 하나 랜덤 선택
                const egoTiers = ["ZAYIN", "TETH", "HE", "WAW"];
                const egoTier = egoTiers[Math.floor(Math.random() * egoTiers.length)];
                const egos = egoList[egoTier];
                const chosenEgo = egos[Math.floor(Math.random() * egos.length)];
                return { type: "ego", tier: egoTier, sinner: chosenEgo.sinner, name: chosenEgo.name };
            } else if (rand < 1.3 + 2.9) {
                // 3성 인격 (2.9%)
                const selectedItem = identities_3star[Math.floor(Math.random() * identities_3star.length)];
                return { type: "identity", tier: "000", sinner: selectedItem.sinner, name: selectedItem.name };
            } else if (rand < 1.3 + 2.9 + 12.8) {
                // 2성 인격 (12.8%)
                const selectedItem = identities_2star[Math.floor(Math.random() * identities_2star.length)];
                return { type: "identity", tier: "00", sinner: selectedItem.sinner, name: selectedItem.name };
            } else {
                // 1성 인격 (83%)
                const selectedItem = identities_1star[Math.floor(Math.random() * identities_1star.length)];
                return { type: "identity", tier: "0", sinner: selectedItem.sinner, name: selectedItem.name };
            }
        }

        function pullGacha(count) {
            const container = document.getElementById("result-container");
            container.innerHTML = "";

            for (let i = 0; i < count; i++) {
                const isGuaranteed = (count === 10 && i === 9);
                const result = getRandomItem(isGuaranteed);

                const card = document.createElement("div");
                card.className = `card`;

                if (result.type === "ego") {
                    let egoIconClass = "ego-zayin-icon";
                    if (result.tier === "TETH") egoIconClass = "ego-teth-icon";
                    else if (result.tier === "HE") egoIconClass = "ego-he-icon";
                    else if (result.tier === "WAW") egoIconClass = "ego-waw-icon";

                    card.innerHTML = `
                        <div class="ego-icon ${egoIconClass}"></div>
                        <div class="card-name">${result.sinner}<br><span style="font-size:11px; color:#ff9800;">[E.G.O] ${result.name}</span></div>
                        <div class="card-identity">Limbus E.G.O</div>
                    `;
                } else {
                    let tierIconClass = "tier-0-icon";
                    if (result.tier === "000") tierIconClass = "tier-000-icon";
                    else if (result.tier === "00") tierIconClass = "tier-00-icon";

                    card.innerHTML = `
                        <div class="tier-icon ${tierIconClass}"></div>
                        <div class="card-name"><span style="font-size:11px; color:#aaa;">${result.name}</span><br>${result.sinner}</div>
                        <div class="card-identity">Limbus Identity</div>
                    `;
                }
                
                container.appendChild(card);
            }
        }
    </script>
</body>
